[project]
name = "flask-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dynaconf>=3.2.13",
    "flask>=3.1.3",
    "flask-admin>=2.2.0",
    "flask-bootstrap>=3.3.7.1",
    "flask-pymongo>=3.0.1",
    "flask-simplelogin>=0.3.0",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "legacy-cgi>=2.6.4",
    "mistune>=3.2.1",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
]

[project.scripts]
blog = "blog.app:create_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["./blog"]
