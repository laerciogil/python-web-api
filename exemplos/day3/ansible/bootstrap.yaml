---
- hosts: webservers
  remote_user: root
  vars:
    ansible_ssh_private_key_file: ~/.ssh/id_rsa_digital_ocean
    ansible_python_interpreter: /usr/bin/python3
    system_user: appuser
    appuser_password: "{{ lookup('env', 'APPUSER_PASSWORD') | default('changeme', true) }}"
  tasks:
    - name: Create system user
      user:
        name: "{{ system_user }}"
        system: true
        shell: /bin/bash
        home: "/home/{{ system_user }}"
        create_home: true
        password: "{{ appuser_password | password_hash('sha512') }}"
        groups: sudo
        append: true

    - name: Create .ssh directory for appuser
      file:
        path: "/home/{{ system_user }}/.ssh"
        state: directory
        owner: "{{ system_user }}"
        group: "{{ system_user }}"
        mode: '0700'

    - name: Copy root's authorized_keys to appuser
      copy:
        src: /root/.ssh/authorized_keys
        dest: "/home/{{ system_user }}/.ssh/authorized_keys"
        owner: "{{ system_user }}"
        group: "{{ system_user }}"
        mode: '0600'
        remote_src: true