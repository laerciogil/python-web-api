---
- hosts: webservers
  remote_user: appuser
  vars:
    msg: Hello
    ansible_ssh_private_key_file: ~/.ssh/id_rsa_digital_ocean
    ansible_python_interpreter: /usr/bin/python3
    system_user: appuser
    base_path: /app
    repo_url: https://github.com/laerciogil/python-web-api.git
    repo_path: "{{ base_path }}/python-web-api"
    app_path: "{{ repo_path }}/exemplos/day2/django"
    app_name: django_blog
    settings_path: "{{ app_name }}.settings"
    database_path: "{{ base_path }}/db.sqlite3"
    venv_path: /home/{{ system_user }}/.venv
    django_admin: "{{ venv_path }}/bin/django-admin"
  environment:
    PYTHONPATH: "{{ app_path }}"
    DJANGO_SETTINGS_MODULE: "{{ settings_path }}"
    BLOG_ENV: production
  tasks:
    - name: Packages Installation
      become: true
      apt:
        update_cache: true
        state: present
        pkg:
          - python3-dev
          - python-is-python3
          - nginx
          - git
          - sqlite3
          - python3.12-venv
  
    - name: Check if uv is installed
      stat:
        path: /home/{{ system_user }}/.local/bin/uv
      register: uv_binary

    - name: Install uv
      become: false
      shell: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
      when: not uv_binary.stat.exists

    - name: Add uv to PATH
      lineinfile:
        path: /home/{{ system_user }}/.bashrc
        line: 'export PATH="$HOME/.local/bin:$PATH"'
        state: present

    - name: Create virtual environment with uv
      shell: /home/{{ system_user }}/.local/bin/uv venv {{ venv_path }}
      args:
        creates: "{{ venv_path }}/bin/python"

    - name: Adding appuser to www-data group (nginx group)
      become: true
      user:
        name: "{{ system_user }}"
        groups:
          - www-data
        append: true

    - name: Create app directory
      become: true
      file:
        path: "{{ base_path }}"
        state: directory
        owner: "{{ system_user }}"
        group: www-data
        mode: '0755'
        recurse: true

    - name: Repository Codebase
      git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_path }}"
        single_branch: true
        version: main
        force: true

    - name: Install project dependencies with uv
      shell: /home/{{ system_user }}/.local/bin/uv pip install --python {{ venv_path }}/bin/python {{ app_path }}
      args:
        chdir: "{{ app_path }}"

    - name: Place the app settings file 
      template:
        src: templates/blog_settings.toml.j2
        dest: "{{ base_path }}/blog_settings.toml"

    - name: Django - Get the database name
      command:
        chdir: "{{ base_path }}"
        cmd: >-
          {{ django_admin }} shell -c
          "from django.conf import settings;print(settings.DATABASES.default.NAME)"
      register: django_db_name

    - name: Django - Assert App is correctly set
      assert:
        that: django_db_name.stdout_lines[-1] == database_path

    - name: Django - DB Migration
      command:
        chdir: "{{ base_path }}"
        cmd: "{{ django_admin }} migrate --noinput"

    - name: Django - Check if admin user exists 
      command:
        chdir: "{{ base_path }}"
        cmd: >-
          {{ django_admin }} shell -c 
          "from django.contrib.auth.models import User;print(User.objects.count())"
      register: django_admin_user_count

    - name: Django - Create admin user
      command:
        chdir: "{{ base_path }}"
        cmd: >-
          {{ django_admin }} shell -c 
          "from django.contrib.auth.models import User;
          User.objects.create_superuser('admin', 'admin@example.com', 'admin')"
      when: django_admin_user_count.stdout_lines[-1] == "0"
       
    - name: Django - Collect static files
      command:
        chdir: "{{ base_path }}"
        cmd: "{{ django_admin }} collectstatic --noinput"
    
    - name: Gunicorn
      become: true
      block:
        - name: Gunicorn - Install 
          shell: /home/{{ system_user }}/.local/bin/uv pip install --python {{ venv_path }}/bin/python gunicorn

        - name: Gunicorn - socket file 
          template:
            src: templates/gunicorn.socket.j2
            dest: /etc/systemd/system/gunicorn.socket

        - name: Gunicorn - service file
          template:
            src: templates/gunicorn.service.j2
            dest: /etc/systemd/system/gunicorn.service
            
        - name: Gunicorn - Reload systemd
          systemd:
            daemon_reload: yes
      
        - name: Gunicorn - Start service
          systemd:
            state: started
            enabled: true
            name: gunicorn.socket
      
    - name: NGINX
      become: true
      block:
        - name: NGINX - Copy site config
          template:
            src: templates/nginx_blog.j2
            dest: "/etc/nginx/sites-available/nginx_blog"

        - name: NGINX - Enable site config
          file:
            src: "/etc/nginx/sites-available/nginx_blog"
            dest: /etc/nginx/sites-enabled/default
            state: link
        
        - name: NGINX - Reload service
          systemd:
            state: restarted
            name: nginx